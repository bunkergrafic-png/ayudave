<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Rifalo</title>
    <meta name="description" content="Rifalo: organiza tus rifas con vendedores, pagos verificados y sorteo transparente." />
    <meta name="theme-color" content="#5B21B6" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <style>
      #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #2E1065; }

      @keyframes b { to { transform: scale(.8) rotate(12deg); } }
    </style>

  <body>
    <div id="app"><div id="boot"><div></div></div></div>
    <script type="module" src="/src/main.js"></script>
